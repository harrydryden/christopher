name: Capacity probe

# scripts/benchmark-users.mjs at its default shape (100 accounts, 20 companies, 100 polling tabs),
# weekly and on demand, never on a pull request: runner noise must not block a merge. A failed run
# opens (or comments on) an issue instead (docs/PERFORMANCE-GUIDE.md 5.7).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: capacity-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: christopher_users_benchmark
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/christopher_users_benchmark
      COL_DISABLE_BROWSER: "1"
      USERS_REPORT_PATH: ${{ github.workspace }}/users-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @col/web build
        env:
          SESSION_SECRET: build-only-0123456789abcdef0123456789abcdef
      - run: node scripts/benchmark-users.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capacity-probe-report
          path: users-report.json
          retention-days: 90
          if-no-files-found: ignore
      - if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let failures = 'The probe did not write a report; see the run log.';
            try { failures = JSON.parse(fs.readFileSync(process.env.USERS_REPORT_PATH, 'utf8')).failures.map(f => `- ${f}`).join('\n') || failures; } catch {}
            const title = 'Weekly capacity probe failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The weekly run of \`scripts/benchmark-users.mjs\` failed on ${context.sha.slice(0, 7)}.\n\n${failures}\n\nRun and report: ${run}`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'performance', per_page: 100 });
            const existing = open.find(issue => issue.title === title);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['performance'] });
