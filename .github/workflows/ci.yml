name: CI

# A pull request is checked once, on its merge result. main is checked again after a
# merge, because that run is what the release check is gated on. Pushing to a branch
# that has no pull request open runs nothing; open the pull request and it is checked.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref. A new push to a pull request cancels the run still working on the
# commit it replaced; a run on main is never cancelled, because worker-release only
# fires for a successful one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that only needs a database: the type surface and every suite.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ava_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ava_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ava_test
      AVA_DISABLE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm typecheck:eval
      - run: pnpm -r test
      - name: Test release and evaluation scripts
        run: pnpm exec node --test scripts/*.test.mjs
      # The committed evaluation reports must name the prompt set that ships; a prompt change
      # without a report at its version (verified, or marked unverified) fails here.
      - name: Check evaluation reports against the shipped prompt set
        run: pnpm exec tsx scripts/check-evaluation-reports.ts

  # The worker suite again, in a shuffled file order and under a flipped query plan. Both are
  # cheap and catch the class of test that passes only because of the order rows happen to come
  # back in: a suite that leaks state into another file, or a scan fixture whose rows share one
  # frozen timestamp and are told apart by whichever the planner returns first.
  order-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ava_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ava_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ava_test
      AVA_DISABLE_BROWSER: "1"
      PGOPTIONS: "-c enable_indexscan=off -c enable_bitmapscan=off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ava/worker exec vitest run --sequence.shuffle.files --sequence.seed ${{ github.run_number }}

  # Everything that needs a real browser: the headless Chromium test and the smoke
  # run, which builds the interface, signs in, fetches every page and drives the CV
  # workspace through Playwright. Runs beside `check`, not after it.
  browser-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ava_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ava_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ava_test
      AVA_DISABLE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      # Restored before install, so the key never sees a node_modules tree.
      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/next.config.*', 'apps/web/package.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @ava/worker exec node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      # Keyed on that version, so a Playwright bump downloads Chromium again and
      # nothing else does. The install step below still runs: on a hit it skips the
      # download and only settles the operating system packages.
      - name: Restore the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter @ava/worker exec playwright install --with-deps chromium
      - run: pnpm --filter @ava/worker exec vitest run src/browser.test.ts
        env:
          AVA_DISABLE_BROWSER: "0"
      - run: pnpm db:migrate
      - run: pnpm smoke:web

  # The image Render deploys, built and booted here so that a broken Dockerfile, a manifest the
  # image does not copy or a runtime import error fails the pull request instead of the deploy.
  # Runs beside the other two. Layers are cached in GitHub's cache, so an unchanged lockfile
  # reuses the dependency install; the Playwright base image itself is pulled each time.
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ava_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ava-worker:ci
          cache-from: type=gha,scope=worker-image
          cache-to: type=gha,scope=worker-image,mode=max
      - name: Boot the image against the job's database and wait for /healthz
        run: |
          docker run -d --name worker --network host \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/ava_test \
            -e AVA_DISABLE_BROWSER=1 -e PORT=8080 \
            -e SCRAPER_CONTACT_EMAIL=ci@ava.dev -e ADMIN_EMAILS=ci@ava.dev \
            ava-worker:ci
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok":true'; then healthy=1; break; fi
            sleep 2
          done
          docker logs worker
          test "${healthy:-0}" = 1
      - name: Check it runs unprivileged under an init process
        run: |
          test "$(docker exec worker id -u)" != 0
          test "$(docker exec worker cat /proc/1/comm)" = tini
      - if: always()
        run: docker rm -f worker || true
