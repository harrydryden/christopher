name: Release

# Not part of CI, so a pull request never lists a skipped release job. This fires
# only after CI itself has passed on main, which keeps the old `needs: check` promise:
# the release check cannot go green before main is green.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-identity
  cancel-in-progress: true

jobs:
  worker-release:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # GITHUB_SHA on a workflow_run is the default branch's tip, which is not
      # necessarily the merge CI just passed on, so the commit is named explicitly.
      - name: Verify the running worker includes this merge
        run: node scripts/verify-worker-release.mjs
        env:
          WORKER_HEALTH_URL: ${{ vars.WORKER_HEALTH_URL }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

  web-release:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the running web application includes this merge
        run: node scripts/verify-web-release.mjs
        env:
          WEB_HEALTH_URL: ${{ vars.WEB_HEALTH_URL }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
